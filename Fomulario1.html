<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Formulário 1</title>
</head>
<body>
    <p><h1>Formulário 1</h1></p>
    <form action="" method="">
        <div class="row g-3">
            <div class="col-sm-3">
                <label class="form-label" for="firstName">First name</label>
                <input class="form-control" type="text" id="firstName" name="firstName" placeholder="Firts Name" required>
            </div>
            <div class="col-sm-3">
                <label class="form-label" for="lastName">Last name</label>
                <input class="form-control" type="text" id="lastName" name="lastName" placeholder="Last name" required>
            </div>
            <div class="col-sm-3">
                <label class="form-label" for="username">Username</label>
                 <div class="input-group">
                    <div class="input-group-text">@</div>
                    <input class="form-control" type="text" id="username" name="username" placeholder="Username" required>
                </div>
            </div>
        </div>
        <br>
        <div class="row g-3">
            <div class="col-sm-5">
                <label class="form-label" for="city">City</label>
                <input class="form-control" type="text" id="city" name="city" placeholder="City" required>
            </div>
            <div class="col-sm-2">
                <label class="form-label" for="state">State</label>
                <input class="form-control" type="text" id="state" name="state" placeholder="State" required>
            </div>
            <div class="col-sm-2">
                <label class="form-label" for="zip">Zip</label>
                <input class="form-control" type="text" id="zip" name="zip" placeholder="Zip" required>
            </div>
        </div>
        <br>
        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="checkbox" name="checkbox" required>
                <label class="form-check-label" for="checkbox">
                    Agree to terms and conditions
                </label>
            </div>
        <br>
        <div class="col-12">
            <button type="submitForm" class="btn btn-primary">Submit form</button>
        </div>
        <br>
    </form>
</body>
</html>
