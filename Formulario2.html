<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Formulário 2</title>
</head>
<body>
    <p><h1>Formulário 2</h1></p>
    <form action="" method="">

        <div class="row">
            <div class="col">
                <div class="row">
                    <div class="col">
                        <label class="form-label" for="codigo">Código</label>
                        <input class="form-control" type="text" id="codigo" name="codigo" placeholder="32" disabled>
                    </div>
                    <div class="col">
                        <label class="form-label" type="text" for="nome">Nome</label>
                        <input class="form-control"type="text" id="nome" name="nome" placeholder="Nome Completo do Cliente">
                    </div>
                </div>

                <br>
                
                <div class="row">
                    <div class="col">
                        <label class="form-label" type="text" for="numCelular">Nº Celular</label>
                        <input class="form-control" type="text" id="numCelular" name="numCelular" placeholder="Nº do celular">
                    </div>
                    <div class="col">
                        <label class="form-label" type="text" for="numTelefone">Nº Telefone fixo</label>
                        <input class="form-control" type="text" id="numTelefone" name="numTelefone" placeholder="Nº do telefone">
                    </div>
                    <div class="col">
                        <label class="form-label" type="text" for="cep">CEP</label>
                        <input class="form-control" type="text" id="cep" name="cep" placeholder="ex: 88308070">
                    </div>
                </div>

                <br>

                <div class="row">
                    <div class="col">
                        <label class="form-label" type="text" for="cidade">Cidade</label>
                        <input class="form-control" type="text" id="cidade" name="cidade" placeholder="Cidade">
                    </div>
                    <div class="col-2">
                        <label class="form-label" type="text" for="uf">UF</label>
                        <input class="form-control" type="text" id="uf" name="uf" placeholder="UF">
                    </div>
                    <div class="col">
                        <label class="form-label" type="" for="status">Status</label>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="row">
                    <div class="col">
                        <label class="form-label" type="text" for="email">E-mail</label>
                        <input class="form-control" type="text" id="email" name="email" placeholder="cliente@dominio.com">
                    </div>
                    <div class="col">
                        <label class="form-label" type="text" for="cpf">CPF</label>
                        <input class="form-control" type="text" id="cpf" name="cpf" placeholder="Só números">
                    </div>
                </div>

                <br>

                <div class="row">
                    <div class="col">
                        <label class="form-label" type="text" for="logradouro">Logradouro</label>
                        <input class="form-control" type="text" id="logradouro" name="logradouro" placeholder="ex: Rua 1400">
                    </div>
                    <div class="col-2">
                        <label class="form-label" type="text" for="numEndereco">Nº</label>
                        <input class="form-control" type="text" id="numEndereco" name="numEndereco" placeholder="Nº">
                    </div>
                    <div class="col">
                        <label class="form-label" type="text" for="bairro">Bairro</label>
                        <input class="form-control" type="text" id="bairro" name="bairro" placeholder="Bairro">
                    </div>
                </div>
            </div>

        <br>

        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <button class="btn btn-danger" type="reset">Resetar</button>
            <button class="btn btn-success" type="button">Próximo</button>
        </div>

    </form>
</body>
</html>
