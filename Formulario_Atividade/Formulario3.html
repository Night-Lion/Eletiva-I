<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
    label
        {
            font-weight: bold;
            color: black;
        }
    </style>
     <title>Formulário 2</title>
</head>
<body>
    <p><h1>Formulário 2</h1></p>
    <form action="" method="">
        <div class="container">
            <div class="row align-items-start">
              <div class="col">
                <label class="form-label" for="PartnerName">Partner Name</label>
                <label class="form-label" for="PartnerLegalName">Partner Legal Name</label>
                <label class="form-label" for="PartnerAddress">Partner Address</label>
                <label class="form-label" for="ContractStartDate">Contract Start Date</label>
                <label class="form-label" for="MinimumLoanAmount">Minimum Loan Amount</label>
                <label class="form-label" for="InterestRate">Interest Rate</label>
              </div>
              <div class="col">
                <input class="form-control" type="text" id="PartnerName" name="PartnerName">
                <input class="form-control" type="text" id="PartnerLegalName" name="PartnerLegalName">
                <input class="form-control" type="text" id="PartnerAddress" name="PartnerAddress">
                <input class="form-control" type="text" id="ContractStartDate" name="ContractStartDate" placeholder="Date Start">
                <input class="form-control" type="text" id="MinimumLoanAmount" name="MinimumLoanAmount">
                <input class="form-control" type="text" id="InterestRate" name="InterestRate">
              </div>
              <div class="col">
                
              </div>
              <div class="col">
                3
              </div>
            </div>
          </div>
    </form>
</body>
</html>
